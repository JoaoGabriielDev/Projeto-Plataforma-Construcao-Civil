spring:
  application:
    name: client-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/client-service
          jwk-set-uri: http://keycloak:8080/realms/client-service/protocol/openid-connect/certs

  datasource:
    url: jdbc:postgresql://postgres:5432/client_db
    username: client_user
    password: client_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true