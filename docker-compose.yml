services:

  client-service:
    build: .
    container_name: client_service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - postgres
      - keycloak
    networks:
      - client_network

  postgres:
    image: postgres:17
    container_name: client_postgres
    environment:
      POSTGRES_DB: client_db
      POSTGRES_USER: client_user
      POSTGRES_PASSWORD: client_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - client_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: client_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - client_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: client_keycloak
    command: start-dev --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: client_user
      KC_DB_PASSWORD: client_password

    ports:
      - "8081:8080"

    volumes:
      - ./keycloak:/opt/keycloak/data/import

    depends_on:
      - postgres

    networks:
      - client_network

volumes:
  postgres_data:

networks:
  client_network: